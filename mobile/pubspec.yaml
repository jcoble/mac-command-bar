name: assembly_phone
description: "Assembly — chat, runs and inbox for the owner's machines, from an Android phone."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Rental Command's versions (rental-management/mobile/pubspec.yaml).
  flutter_riverpod: ^3.3.1
  dio: ^5.9.2
  go_router: ^17.2.3
  flutter_secure_storage: ^10.3.1
  # Funnel Display / Funnel Sans, fetched at runtime (app_typography.dart).
  google_fonts: ^8.1.0
  # Material Symbols Rounded — variable FILL axis for the nav item morph.
  material_symbols_icons: ^4.2928.1
  # Pairing QR code scanner (Rental Command has no QR package).
  mobile_scanner: ^7.4.2
  # The live socket, GET /phone/v1/live (Rental Command's version, there transitive).
  web_socket_channel: ^3.0.3
  # Push notifications (Rental Command's versions, rental-management/mobile/pubspec.yaml).
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  flutter_markdown_plus: ^1.0.12
  # Syntax colours in the file viewer: a pure-Dart highlight.js port that emits
  # tokens we split into per-line spans, so long files render lazily.
  re_highlight: ^0.0.3
  # Opens a pull request's link, which Android hands to the GitHub app when installed.
  url_launcher: ^6.3.3
  # The session terminal page: ghostty-web, as on the desktop, in a WebView.
  webview_flutter: ^4.14.1
  # Attaches a photo or screenshot to a chat message (gallery or camera).
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/terminal/
