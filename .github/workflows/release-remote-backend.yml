name: Release Assembly Remote Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tauri-svelte-preview/src-tauri/**'
      - 'core/**'
      - 'tauri-svelte-preview/scripts/remoteBackendPackage*'
      - 'tauri-svelte-preview/scripts/backendReleaseVersion*'
      - 'tauri-svelte-preview/package.json'
      - 'tauri-svelte-preview/pnpm-lock.yaml'
      - 'tauri-svelte-preview/svelte.config.*'
      - 'tauri-svelte-preview/vite.config.*'
      - '.github/workflows/release-remote-backend.yml'
    tags:
      - 'assembly-backend-v*'

concurrency:
  group: assembly-remote-backend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/assembly-backend-v'))
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri-svelte-preview/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tauri-svelte-preview/src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tauri-svelte-preview

      - name: Select backend version
        id: release
        run: node --experimental-strip-types tauri-svelte-preview/scripts/backendReleaseVersion.ts

      - name: Verify package contracts
        working-directory: tauri-svelte-preview
        run: |
          node --experimental-strip-types --test scripts/backendReleaseVersion.test.ts
          pnpm test:remote-backend-package

      - name: Build remote backend package
        working-directory: tauri-svelte-preview
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          pnpm build
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin mac-command-bar-webview-preview
          pnpm prepare:remote-backend-package "$VERSION"

      - name: Publish signed remote backend package
        working-directory: tauri-svelte-preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARCHIVE=$(find remote-backend-release -type f -name '*.tar.gz' -print -quit)
          test -n "$ARCHIVE"
          pnpm exec tauri signer sign "$ARCHIVE"
          pnpm exec tauri signer sign "$ARCHIVE.download.json"
          gh release create "$RELEASE_TAG" --draft --latest=false --target "$GITHUB_SHA" \
            --title "Assembly Remote Backend v$VERSION" \
            --notes "Download the signed Assembly remote backend package for Linux x86-64."
          gh release upload "$RELEASE_TAG" remote-backend-release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
