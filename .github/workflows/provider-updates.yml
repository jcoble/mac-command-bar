name: Release provider adapters

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
  push:
    branches: [main]
    tags: ['assembly-providers-v*']
    paths:
      - '.github/workflows/provider-updates.yml'
      - 'tauri-svelte-preview/scripts/prepareReleaseAdapters.ts'
      - 'tauri-svelte-preview/scripts/prepareProviderReleaseAssets.ts'
      - 'tauri-svelte-preview/scripts/claudeAcpLauncher.ts'
      - 'tauri-svelte-preview/package.json'
      - 'tauri-svelte-preview/pnpm-lock.yaml'
      - 'tauri-svelte-preview/pnpm-workspace.yaml'
      - 'tauri-svelte-preview/patches/**'

concurrency:
  group: provider-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Resolve current upstream adapters
        working-directory: tauri-svelte-preview
        run: |
          pnpm install --frozen-lockfile
          # Both follow upstream. The stock Claude adapter is compiled with Assembly's
          # launcher (scripts/claudeAcpLauncher.ts); if an upstream release breaks the
          # launcher's imports, the build fails and nothing is published.
          pnpm update @agentclientprotocol/codex-acp @agentclientprotocol/claude-agent-acp --latest
      - name: Check new adapter releases for an npm account takeover
        working-directory: tauri-svelte-preview
        run: node --experimental-strip-types scripts/checkAdapterRelease.ts
      - name: Package and sign adapters
        working-directory: tauri-svelte-preview
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm prepare:release-adapters
          pnpm prepare:provider-release-assets "${{ matrix.target }}"
          pnpm exec tauri signer sign "provider-release/${{ matrix.target }}/provider-manifest-${{ matrix.target }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: providers-${{ matrix.target }}
          path: tauri-svelte-preview/provider-release/${{ matrix.target }}/*
          retention-days: 2
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: providers-*
          path: provider-release
          merge-multiple: true
      - name: Publish separate provider feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=assembly-providers-stable
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "${{ github.sha }}" --title 'Assembly provider adapters' --notes 'Signed ACP adapters, installed independently from Assembly app updates.' --latest=false
          fi
          # Publish payloads first. A concurrent check can only install a complete,
          # signed set: a hash mismatch keeps the existing installation intact.
          for asset in provider-release/provider-*; do
            [[ "$asset" == */provider-manifest-* ]] && continue
            gh release upload "$tag" "$asset" --clobber
          done
          for manifest in provider-release/provider-manifest-*.json; do
            gh release upload "$tag" "$manifest" "$manifest.sig" --clobber
          done
