name: Lifecycle checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lifecycle-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri-svelte-preview/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: tauri-svelte-preview
        run: pnpm install --frozen-lockfile
      - name: Run lifecycle checks
        working-directory: tauri-svelte-preview
        run: |
          pnpm test:async-lifecycle
          pnpm exec node --experimental-strip-types scripts/scanSchedulers.test.ts
          pnpm test:workspace-invoke
          pnpm test:git-diff-timeout
