name: Lifecycle checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lifecycle-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri-svelte-preview/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: tauri-svelte-preview
        run: pnpm install --frozen-lockfile
      - name: Run lifecycle checks
        working-directory: tauri-svelte-preview
        run: |
          pnpm test:async-lifecycle
          pnpm exec node --experimental-strip-types scripts/scanSchedulers.test.ts
          pnpm test:workspace-invoke
          pnpm test:git-diff-timeout
          pnpm test:regressions

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            tauri-svelte-preview/src-tauri
            core
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      # The git tests expect new repositories to start on main, as on the dev machines.
      - name: Start new git repositories on main
        run: git config --global init.defaultBranch main
      # Skipped on this runner only: the two lsp tests need the language servers that pnpm install puts in node_modules/.bin.
      - name: Check and test the app crate
        working-directory: tauri-svelte-preview/src-tauri
        run: |
          cargo check --locked --no-default-features
          cargo test --locked --no-default-features -- \
            --skip files::lsp::tests::a_read_mode_workspace_starts_no_language_server \
            --skip files::lsp::tests::command_search_paths_prefer_pinned_application_language_servers
      - name: Test the core crate
        working-directory: core
        run: cargo test --locked
