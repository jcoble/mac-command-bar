[package]
name = "mac-command-bar-webview-preview"
version = "0.1.0"
description = "Tauri shell for the MacCommandBar Svelte source preview experiment"
authors = ["blackcolours"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mcb-core = { path = "../../core" }
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["test"] }
tauri-plugin-dialog = "2"

[features]
default = []
