[package]
name = "mac-command-bar-webview-preview"
version = "0.1.0"
description = "Tauri shell for Assembly"
authors = ["blackcolours"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-client-protocol = "=2.0.0"
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4"
futures-util = "0.3"
httpdate = "1"
libc = "0.2"
mcb-core = { path = "../../core" }
portable-pty = "0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
security-framework = "3.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["test", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["io-util", "net", "process", "sync"] }
uuid = { version = "1", features = ["v4"] }

# Already in the tree through tauri/wry; declared here so the browser view can
# ask the NSWindow for its content inset, which Tauri's window APIs do not
# report.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"

[features]
default = []

# Dev builds keep the app crate unoptimized (fast rebuilds, debuggable) but
# compile every dependency — serde, the file walker, the PTY layer, mcb-core —
# at full optimization. Without this, dev-profile serde and IO run 3-30x slower
# than release, which read as "the desktop app is slow" while the web preview
# (optimized Node) felt fast. One long rebuild the first time, cached after.
[profile.dev.package."*"]
opt-level = 3
